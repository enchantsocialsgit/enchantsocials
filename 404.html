<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Ascend Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #050505;
            color: #777;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }
        .code {
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f0f0f0;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        a {
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all .2s;
        }
        .primary {
            background: #8b5cf6;
            color: #fff;
        }
        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139,92,246,0.3);
        }
        .secondary {
            background: rgba(255,255,255,0.05);
            color: #bbb;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .secondary:hover {
            border-color: rgba(255,255,255,0.15);
            color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The page you're looking for has moved or doesn't exist. Let us help you find what you need.</p>
    <div class="links">
        <a href="index.html" class="primary">Go Home</a>
        <a href="assess.html" class="secondary">Take the AI Assessment</a>
        <a href="book.html" class="secondary">Book a Call</a>
    </div>
</body>
</html>
